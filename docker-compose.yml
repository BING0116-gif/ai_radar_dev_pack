services:
  backend:
    build: ./backend
    container_name: ai-radar-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # env_file above wins for real secrets; these defaults keep the demo
      # self-contained even if a key is missing from .env
      APP_ENV: development
      DATABASE_URL: sqlite:////data/ai_radar.db
      WORKSPACE_ROOT: /data/workspace
      SCHEDULER_ENABLED: "false"
      # LLM 凭据优先取 shell / 系统环境变量（不进 .env），缺失时回退到 .env 值
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ai_radar_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-radar-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ai_radar_data: